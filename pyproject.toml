[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudsync"
version = "0.1.0"
description = "rclone bisync orchestrator for multiple cloud accounts (Drive, OneDrive, S3, ...) on a Proxmox LXC"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "you" }]
# Runtime has zero dependencies (stdlib only); this file exists for the dev
# workflow (pytest) and the dev-only console script. Deployment does NOT use
# pip — see install.sh / README (launcher symlink model).
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cloudsync = "cloudsync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
